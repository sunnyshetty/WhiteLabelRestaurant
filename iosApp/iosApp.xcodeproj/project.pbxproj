			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Copies the brand's Firebase config into the app. Brand plists live outside the\n# synchronized iosApp/ group so Xcode never bundles more than one of them.\nDEST=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist\"\nrm -f \"$DEST\"\n\nif [ -z \"$BRAND\" ]; then\n  echo \"warning: No BRAND for configuration ${CONFIGURATION}; Firebase stays unconfigured. Use a brand scheme.\"\n  exit 0\nfi\n\nSRC=\"${SRCROOT}/${BRAND}/GoogleService-Info.plist\"\nif [ ! -f \"$SRC\" ]; then\n  case \"$CONFIGURATION\" in\n    Release*) echo \"error: Missing ${SRC} for brand ${BRAND}.\"; exit 1 ;;\n    *) echo \"warning: Missing ${SRC}; Firebase stays unconfigured in this build.\"; exit 0 ;;\n  esac\nfi\n\nPLIST_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c \"Print :BUNDLE_ID\" \"$SRC\")\nif [ \"$PLIST_BUNDLE_ID\" != \"$PRODUCT_BUNDLE_IDENTIFIER\" ]; then\n  echo \"error: ${SRC} is for ${PLIST_BUNDLE_ID}, but this build is ${PRODUCT_BUNDLE_IDENTIFIER}.\"\n  exit 1\nfi\n\ncp \"$SRC\" \"$DEST\"\n";
		};
